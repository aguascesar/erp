<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia - ERP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/asistencia.css">
</head>
<body>
    <div class="asistencia-container">
        <header class="asistencia-header">
            <h1><i class="fas fa-user-clock"></i> Control de Asistencia</h1>
            <div class="header-actions">
                <button id="btnNuevaMarca" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Nueva Marca
                </button>
                <div class="date-filter">
                    <input type="date" id="fechaInicio" class="form-control">
                    <span>a</span>
                    <input type="date" id="fechaFin" class="form-control">
                    <button id="btnFiltrar" class="btn btn-secondary">
                        <i class="fas fa-filter"></i> Filtrar
                    </button>
                </div>
            </div>
        </header>

        <div class="asistencia-content">
            <div class="marcas-container">
                <div class="marcas-header">
                    <h2>Registro de Marcaciones</h2>
                    <div class="actions">
                        <button id="btnExportarExcel" class="btn btn-export">
                            <i class="fas fa-file-excel"></i> Excel
                        </button>
                        <button id="btnExportarPDF" class="btn btn-export">
                            <i class="fas fa-file-pdf"></i> PDF
                        </button>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table id="tblMarcas" class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>RUT</th>
                                <th>Nombre</th>
                                <th>Fecha</th>
                                <th>Hora</th>
                                <th>Tipo</th>
                                <th>Ubicación</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tblMarcasBody">
                            <!-- Datos cargados dinámicamente -->
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination">
                    <button id="btnAnterior" class="btn btn-pagination">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <span id="paginacionInfo">Página 1 de 1</span>
                    <button id="btnSiguiente" class="btn btn-pagination">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
            
            <div class="resumen-container">
                <div class="card">
                    <div class="card-header">
                        <h3>Resumen Diario</h3>
                        <span id="fechaResumen">21/10/2023</span>
                    </div>
                    <div class="card-body">
                        <div class="resumen-item">
                            <span class="resumen-label">Total Trabajadores:</span>
                            <span class="resumen-value" id="totalTrabajadores">0</span>
                        </div>
                        <div class="resumen-item">
                            <span class="resumen-label">Marcaciones Hoy:</span>
                            <span class="resumen-value" id="totalMarcaciones">0</span>
                        </div>
                        <div class="resumen-item">
                            <span class="resumen-label">Atrasos:</span>
                            <span class="resumen-value text-danger" id="totalAtrasos">0</span>
                        </div>
                        <div class="resumen-item">
                            <span class="resumen-label">Sin Marcar:</span>
                            <span class="resumen-value text-warning" id="sinMarcar">0</span>
                        </div>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-header">
                        <h3>Notificaciones</h3>
                    </div>
                    <div class="card-body" id="notificaciones">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> No hay notificaciones recientes.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nueva Marca -->
    <div id="modalNuevaMarca" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Registrar Nueva Marca</h3>
                <span class="close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="formNuevaMarca">
                    <div class="form-group">
                        <label for="trabajador">Trabajador *</label>
                        <select id="trabajador" class="form-control" required>
                            <option value="">Seleccione un trabajador</option>
                            <!-- Opciones cargadas dinámicamente -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="fechaMarca">Fecha *</label>
                        <input type="date" id="fechaMarca" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="horaMarca">Hora *</label>
                        <input type="time" id="horaMarca" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="tipoMarca">Tipo de Marca *</label>
                        <select id="tipoMarca" class="form-control" required>
                            <option value="entrada">Entrada</option>
                            <option value="salida">Salida</option>
                            <option value="colacion_inicio">Inicio Colación</option>
                            <option value="colacion_termino">Término Colación</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="observacion">Observación</label>
                        <textarea id="observacion" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" id="btnCancelarMarca">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Marca</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../../assets/js/asistencia.js"></script>
</body>
</html>
