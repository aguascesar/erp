<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Pesaje Genérico</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/css/pesaje_generico.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <h2 class="mt-3">Módulo de Pesaje Genérico</h2>
                <hr>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <i class="bi bi-speedometer2"></i> Panel de Control
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="producto" class="form-label">Producto</label>
                            <select id="producto" class="form-select">
                                <option value="">Seleccione un producto</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="peso" class="form-label">Peso (kg)</label>
                            <div class="input-group">
                                <input type="number" step="0.01" class="form-control" id="peso" placeholder="0.00">
                                <span class="input-group-text">kg</span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="notas" class="form-label">Notas</label>
                            <textarea class="form-control" id="notas" rows="2"></textarea>
                        </div>
                        <div class="d-grid gap-2">
                            <button id="btnRegistrar" class="btn btn-success">
                                <i class="bi bi-save"></i> Registrar Pesaje
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <i class="bi bi-list"></i> Historial de Pesajes
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover" id="tablaPesajes">
                                <thead>
                                    <tr>
                                        <th>Fecha/Hora</th>
                                        <th>Producto</th>
                                        <th>Peso (kg)</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Los registros se cargarán aquí dinámicamente -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para editar pesaje -->
    <div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Pesaje</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editarId">
                    <div class="mb-3">
                        <label for="editarProducto" class="form-label">Producto</label>
                        <select id="editarProducto" class="form-select">
                            <option value="">Seleccione un producto</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="editarPeso" class="form-label">Peso (kg)</label>
                        <input type="number" step="0.01" class="form-control" id="editarPeso">
                    </div>
                    <div class="mb-3">
                        <label for="editarNotas" class="form-label">Notas</label>
                        <textarea class="form-control" id="editarNotas" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardarCambios">Guardar Cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/pesaje_generico.js"></script>
</body>
</html>
