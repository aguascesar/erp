<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta</title>
    <!-- Estilos -->
    <link rel="stylesheet" href="/assets/css/pos.css">
</head>
<body>
    <div class="pos-container">
        <!-- Barra superior -->
        <header class="pos-header">
            <h1>Punto de Venta</h1>
            <div class="header-actions">
                <button id="nuevaVenta" class="btn btn-primary">Nueva Venta</button>
                <button id="verCarrito" class="btn btn-secondary">Carrito (<span id="contadorCarrito">0</span>)</button>
            </div>
        </header>

        <div class="pos-main">
            <!-- Sección de productos -->
            <section class="productos-section">
                <div class="search-bar">
                    <input type="text" id="buscarProducto" placeholder="Buscar producto...">
                </div>
                <div class="categorias">
                    <!-- Categorías se llenarán dinámicamente -->
                </div>
                <div class="productos-grid" id="listaProductos">
                    <!-- Productos se cargarán dinámicamente -->
                </div>
            </section>

            <!-- Panel del carrito -->
            <aside class="carrito-panel">
                <h2>Resumen de Venta</h2>
                <div class="carrito-items" id="carritoItems">
                    <!-- Ítems del carrito se agregarán aquí -->
                    <p class="empty-cart">El carrito está vacío</p>
                </div>
                <div class="resumen-total">
                    <div class="subtotal">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="impuestos">
                        <span>Impuestos:</span>
                        <span id="impuestos">$0.00</span>
                    </div>
                    <div class="total">
                        <strong>Total:</strong>
                        <strong id="total">$0.00</strong>
                    </div>
                </div>
                <div class="acciones-carrito">
                    <button id="pagar" class="btn btn-success btn-block" disabled>Pagar</button>
                    <button id="cancelarVenta" class="btn btn-danger btn-block">Cancelar</button>
                </div>
            </aside>
        </div>
    </div>

    <!-- El proceso de pago ahora está en proceso.html -->
                    <input type="text" id="comunaCliente" class="form-control" placeholder="Comuna del Cliente">
                </div>
                <div class="form-group">
                    <label for="ciudadCliente">Ciudad</label>
                    <input type="text" id="ciudadCliente" class="form-control" placeholder="Ciudad del Cliente">
                </div>
            </div>

            <!-- Sección de Método de Pago -->
            <div class="metodos-pago-section">
                <h3>Método de Pago</h3>
                <div class="metodos-pago">
                    <button class="metodo-pago" data-metodo="efectivo">
                        <i class="fas fa-money-bill-wave"></i>
                        <span>Efectivo</span>
                    </button>
                    <button class="metodo-pago" data-metodo="debito">
                        <i class="fas fa-credit-card"></i>
                        <span>Débito</span>
                    </button>
                    <button class="metodo-pago" data-metodo="credito">
                        <i class="far fa-credit-card"></i>
                        <span>Crédito</span>
                    </button>
                    <button class="metodo-pago" data-metodo="transferencia">
                        <i class="fas fa-exchange-alt"></i>
                        <span>Transferencia</span>
                    </button>
                    <button class="metodo-pago" data-metodo="cheque">
                        <i class="fas fa-money-check"></i>
                        <span>Cheque</span>
                    </button>
                    <button class="metodo-pago" data-metodo="valevista">
                        <i class="fas fa-receipt"></i>
                        <span>Vale Vista</span>
                    </button>
                </div>
                
                <div class="monto-pago">
                    <label for="montoRecibido">Monto Recibido (CLP$):</label>
                    <input type="number" id="montoRecibido" min="0" step="1" oninput="this.value = Math.max(0, parseInt(this.value) || 0)">
                    <p id="cambio" class="text-right">Cambio: CLP$ 0</p>
                </div>
            </div>

            <!-- Resumen de la Venta -->
            <div class="resumen-venta">
                <h3>Resumen de la Venta</h3>
                <div class="resumen-detalle">
                    <div class="resumen-item">
                        <span>Subtotal:</span>
                        <span id="resumen-subtotal">CLP$ 0</span>
                    </div>
                    <div class="resumen-item">
                        <span>IVA (19%):</span>
                        <span id="resumen-iva">CLP$ 0</span>
                    </div>
                    <div class="resumen-total">
                        <strong>Total:</strong>
                        <strong id="resumen-total">CLP$ 0</strong>
                    </div>
                </div>
            </div>
    <!-- Scripts -->
    <script src="/assets/js/pos.js"></script>
</body>
</html>
