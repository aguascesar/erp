<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Ventas - Módulo de Ventas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="../../assets/css/ventas.css">
    <style>
        .filtros-avanzados {
            background-color: #f8f9fc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .estado-badge {
            font-size: 0.75rem;
            padding: 0.35em 0.65em;
        }
        .dataTables_wrapper .dataTables_filter {
            text-align: right;
        }
        .dataTables_wrapper .dataTables_length {
            margin-bottom: 15px;
        }
        .acciones-rapidas .btn {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
            margin-right: 3px;
        }
    </style>
</head>
<body>
    <div id="content-wrapper" class="ventas-container">
        <div class="container-fluid">
            <!-- Encabezado -->
            <div class="d-sm-flex align-items-center justify-content-between mb-4">
                <h1 class="h3 mb-0 text-gray-800">Listado de Ventas</h1>
                <div>
                    <a href="nueva_venta.html" class="btn btn-primary">
                        <i class="fas fa-plus-circle"></i> Nueva Venta
                    </a>
                    <button class="btn btn-outline-secondary" id="btnFiltros">
                        <i class="fas fa-filter"></i> Filtros
                    </button>
                    <button class="btn btn-outline-secondary" id="btnExportar">
                        <i class="fas fa-file-export"></i> Exportar
                    </button>
                </div>
            </div>

            <!-- Filtros avanzados -->
            <div class="filtros-avanzados mb-4" id="filtrosAvanzados" style="display: none;">
                <h5 class="mb-3">Filtros Avanzados</h5>
                <form id="formFiltros">
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Fecha desde</label>
                            <input type="date" class="form-control" id="fechaDesde">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Fecha hasta</label>
                            <input type="date" class="form-control" id="fechaHasta">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Estado</label>
                            <select class="form-select" id="filtroEstado">
                                <option value="">Todos</option>
                                <option value="pendiente">Pendiente</option>
                                <option value="completada">Completada</option>
                                <option value="anulada">Anulada</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Vendedor</label>
                            <select class="form-select" id="filtroVendedor">
                                <option value="">Todos</option>
                                <option value="1">Usuario 1</option>
                                <option value="2">Usuario 2</option>
                            </select>
                        </div>
                        <div class="col-12 text-end">
                            <button type="button" class="btn btn-secondary me-2" id="btnLimpiarFiltros">
                                <i class="fas fa-undo"></i> Limpiar
                            </button>
                            <button type="button" class="btn btn-primary" id="btnAplicarFiltros">
                                <i class="fas fa-check"></i> Aplicar Filtros
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Tarjetas de resumen -->
            <div class="row mb-4">
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-primary h-100 py-2">
                        <div class="card-body
                        <div class="row no-gutters align-items-center">
                            <div class="col mr-2">
                                <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">
                                    Ventas del Mes</div>
                                <div class="h5 mb-0 font-weight-bold text-gray-800">$24,000</div>
                            </div>
                            <div class="col-auto">
                                <i class="fas fa-calendar fa-2x text-gray-300"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-success h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-success text-uppercase mb-1">
                                        Ventas del Día</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">$1,200</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fas fa-dollar-sign fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-info h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                        Ventas Pendientes</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">5</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fas fa-clock fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-xl-3 col-md-6 mb-4">
                    <div class="card border-left-warning h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-warning text-uppercase mb-1">
                                        Ticket Promedio</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">$245.50</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fas fa-receipt fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de ventas -->
            <div class="card shadow mb-4">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover" id="tablaVentas" style="width:100%">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Fecha</th>
                                    <th>Cliente</th>
                                    <th class="text-end">Total</th>
                                    <th>Estado</th>
                                    <th>Vendedor</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Datos de ejemplo -->
                                <tr>
                                    <td>V-001</td>
                                    <td>23/10/2025 15:30</td>
                                    <td>Cliente Ejemplo</td>
                                    <td class="text-end">$237.98</td>
                                    <td><span class="badge bg-success estado-badge">Completada</span></td>
                                    <td>Usuario 1</td>
                                    <td class="text-center acciones-rapidas">
                                        <a href="ver_venta.html?id=1" class="btn btn-sm btn-info" title="Ver">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <button class="btn btn-sm btn-warning" title="Imprimir">
                                            <i class="fas fa-print"></i>
                                        </button>
                                        <button class="btn btn-sm btn-danger" title="Anular">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </td>
                                </tr>
                                <!-- Más filas de ejemplo... -->
                            </tbody>
                            <tfoot>
                                <tr>
                                    <th colspan="3" class="text-end">Total:</th>
                                    <th class="text-end">$1,845.75</th>
                                    <th colspan="3"></th>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS y dependencias -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables JS -->
    <script type="text/javascript" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
    <!-- Scripts personalizados -->
    <script src="../../assets/js/ventas.js"></script>
    <script>
        $(document).ready(function() {
            // Inicializar DataTable
            var table = $('#tablaVentas').DataTable({
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/1.11.5/i18n/es-ES.json'
                },
                order: [[1, 'desc']], // Ordenar por fecha descendente por defecto
                responsive: true,
                dom: '<"d-flex justify-content-between align-items-center mb-3"f<"ms-3"l>>rtip',
                pageLength: 25,
                buttons: [
                    'copy', 'csv', 'excel', 'pdf', 'print'
                ]
            });

            // Mostrar/ocultar filtros avanzados
            $('#btnFiltros').click(function() {
                $('#filtrosAvanzados').slideToggle();
            });

            // Aplicar filtros
            $('#btnAplicarFiltros').click(function() {
                // Aquí iría la lógica para aplicar los filtros
                table.draw();
                $('#filtrosAvanzados').slideUp();
            });

            // Limpiar filtros
            $('#btnLimpiarFiltros').click(function() {
                $('#formFiltros')[0].reset();
                table.search('').columns().search('').draw();
            });

            // Exportar datos
            $('#btnExportar').click(function() {
                // Aquí iría la lógica para exportar los datos
                alert('Exportando datos...');
            });
        });
    </script>
</body>
</html>
